<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIVERSE3D — Cartographie de l'univers proche</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0b10" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #0b0b10;
        --color-fg: #f8fafc;
        --color-card: rgba(20, 22, 30, 0.85);
        --color-card-solid: #14161e;
        --color-border: #1e293b;
        --color-muted: #94a3b8;
        --color-accent: #3b82f6;
        --color-accent-bg: #1e3a5f;
        --space-2: 4px;
        --space-3: 8px;
        --space-4: 12px;
        /* Police "HUD" technique (cf. capture de référence Solar System
           Scope) : géométrique, majuscules espacées — réservée aux libellés
           courts (boutons, breadcrumb, titres, étiquettes 3D). Le corps de
           texte (descriptions, paragraphes) garde une police lisible
           classique, cf. .learn-more p / #info-panel p plus bas. */
        --font-display: "Orbitron", system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--color-bg); color: var(--color-fg); font-family: system-ui, sans-serif; overflow: hidden; }
      /* 100vh = hauteur "barres de navigateur cachées" (viewport statique) :
         juste après un chargement de page, Chrome affiche sa barre d'adresse
         + sa barre de nav du bas, donc le viewport réel visible est plus
         petit que ce 100vh — tout élément ancré en bottom:Npx dans ce
         conteneur (ex. #selection-card) se retrouve calculé trop bas et
         caché derrière la Chrome UI elle-même. 100dvh suit la taille
         réellement visible ; fallback 100vh pour les navigateurs sans dvh. */
      #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
      #scene-canvas { display: block; width: 100%; height: 100%; }
      #ui-overlay { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; }
      #ui-overlay > * { pointer-events: auto; }
      #ui-overlay button {
        font-family: var(--font-display); background: var(--color-card); border: 1px solid var(--color-border);
        color: var(--color-muted); cursor: pointer; font-size: 12px; letter-spacing: 0.04em; border-radius: 6px;
        min-height: 30px; transition: border-color 150ms ease-out, background-color 150ms ease-out, color 150ms ease-out;
      }
      #ui-overlay button:hover:not(:disabled) { border-color: var(--color-accent); color: var(--color-fg); }
      #ui-overlay button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
      #ui-overlay button.active { background: var(--color-accent-bg); color: #ffffff; border-color: var(--color-accent); }
      #ui-overlay button:disabled { opacity: 0.4; cursor: default; }
      #top-left-bar { position: absolute; top: var(--space-4); left: var(--space-4); z-index: 10; display: flex; align-items: center; gap: var(--space-3); }
      #home-btn { display: none; padding: 4px 10px; font-size: 13px; }
      #home-btn.visible { display: inline-block; }
      #breadcrumb { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.03em; opacity: 0.8; }
      /* z-index 35 (pas 10) : le champ reste utilisable depuis l'écran
         d'accueil (#home-screen, z-index 30) et sa liste de résultats doit
         alors se peindre par-dessus le titre "UNIVERS3D", pas dessous. */
      #search-box { position: absolute; top: var(--space-4); left: 50%; transform: translateX(-50%); z-index: 35; }
      #search-input {
        font-family: inherit; font-size: 13px; background: var(--color-card); border: 1px solid var(--color-border);
        color: var(--color-fg); border-radius: 6px; padding: 6px 10px; width: 200px;
      }
      #search-input:focus { outline: 2px solid #8fd0ff; }
      #search-input.not-found { border-color: #e05c5c; }
      /* Liste de résultats groupée par catégorie (Étoiles/Planètes/Lunes/
         Constellations). Le <datalist> natif du navigateur a été retiré
         (2026-08-02, cf. main.ts) : sa popup non stylable masquait ce
         regroupement. */
      #search-results {
        display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
        max-height: 320px; overflow-y: auto; background: var(--color-card-solid);
        border: 1px solid var(--color-border); border-radius: 8px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        z-index: 15;
        /* Layer de composition dédié : sans ça, Chrome peut laisser le
           <canvas> WebGL (rendu continu, autre pipeline de composition)
           "percer" ponctuellement un overlay DOM par-dessus lui pendant un
           scroll, ligne par ligne, malgré un z-index/background corrects
           (observé le 2026-08-03 : une seule ligne de résultat laissait
           passer le titre #home-title alors que les lignes voisines
           masquaient bien le canvas). transform force son propre calque. */
        transform: translateZ(0);
      }
      #search-results.visible { display: block; }
      /* Bouton de catégorie repliable (accordéon, repliée par défaut, cf.
         expandedSearchCategories dans main.ts) — surcharge le style bouton
         générique de #ui-overlay button (fond/bordure/radius) pour rester
         une simple ligne d'en-tête pleine largeur. */
      .search-results-section-label {
        display: flex; align-items: center; gap: 6px; width: 100%; box-sizing: border-box;
        min-height: 36px; font-family: var(--font-display); font-size: 10px; letter-spacing: 0.05em;
        text-transform: uppercase; color: var(--color-muted); padding: 8px 12px; text-align: left;
        background: none; border: none; border-left: 3px solid transparent; border-radius: 0; cursor: pointer;
      }
      .search-results-section-label:hover, .search-results-section-label:focus-visible {
        filter: brightness(1.3);
      }
      /* Une couleur "maîtresse" distincte par catégorie (repère visuel rapide
         dans la liste dépliée/repliée), cf. data-kind posé par renderSearchResults
         dans main.ts — pas de lien avec une quelconque couleur physique réelle. */
      .search-results-section-label[data-kind="star"] { color: #f5c451; border-left-color: #f5c451; }
      .search-results-section-label[data-kind="planet"] { color: #7dc4ff; border-left-color: #7dc4ff; }
      .search-results-section-label[data-kind="moon"] { color: #b8c2cc; border-left-color: #b8c2cc; }
      .search-results-section-label[data-kind="constellation"] { color: #c9a0f5; border-left-color: #c9a0f5; }
      .search-results-section-chevron { font-size: 9px; width: 10px; text-align: center; opacity: 0.8; }
      .search-results-empty { font-size: 13px; color: var(--color-muted); padding: 12px; text-align: center; }
      .search-result-item {
        display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;
        min-height: 44px; padding: 6px 12px; background: none; border: none; border-radius: 0;
        color: var(--color-fg); font-family: inherit; font-size: 13px; text-align: left; cursor: pointer;
      }
      .search-result-item:hover, .search-result-item:focus-visible { background: var(--color-accent-bg); }
      .search-result-icon { font-size: 15px; line-height: 1; opacity: 0.8; }
      #breadcrumb button { background: none; border: none; min-height: 0; color: #8fd0ff; cursor: pointer; font-size: 14px; padding: 4px 0; }
      #breadcrumb button:hover { text-decoration: underline; border-color: transparent; color: #8fd0ff; }
      /* Colonne flex plutôt que des `top` en dur : un bouton dont le texte
         passe sur 2 lignes (ex. interprétation scientifique) pousse
         naturellement les suivants au lieu de les chevaucher. */
      #right-toggles {
        position: absolute; top: var(--space-4); right: var(--space-4); z-index: 10;
        display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-3);
        max-width: 240px;
      }
      /* Le panneau d'info occupe les 320px de droite : quand il est visible,
         la colonne de boutons doit se décaler à sa gauche, sinon elle flotte
         (z-index oblige) par-dessus le texte du cartouche. */
      #ui-overlay:has(#info-panel.visible) #right-toggles {
        right: calc(320px + var(--space-4));
      }
      #lang-toggle { display: flex; gap: var(--space-2); }
      #lang-toggle button { padding: 4px 8px; }
      #unit-toggle { display: flex; gap: var(--space-2); }
      #unit-toggle button { padding: 4px 8px; }
      /* Deux boutons persistants (Terre / Soleil) plutôt qu'un unique bouton
         cyclique : un seul comparatif actif à la fois (l'un désactive
         l'autre), mais les deux restent visibles et cliquables en permanence
         sur les fiches planète et étoile. */
      #compare-toggle-group {
        position: absolute; top: 40px; left: var(--space-4); z-index: 10; display: none;
        gap: var(--space-3);
      }
      #compare-toggle-group button { padding: 6px 10px; }
      #pause-toggle {
        position: absolute; top: 76px; left: var(--space-4); z-index: 10; display: none;
        padding: 6px 10px;
      }
      #bottom-left {
        position: absolute; bottom: var(--space-4); left: var(--space-4); z-index: 10;
        display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
        max-width: calc(100vw - 340px);
      }
      #hint { position: static; font-size: 12px; opacity: 0.6; }
      #music-toggle {
        position: static; flex-shrink: 0;
        padding: 6px 10px;
      }
      #music-toggle.muted { opacity: 0.5; }
      #sci-interp-toggle { padding: 6px 10px; max-width: 220px; text-align: right; }
      #orbit-plane-toggle { display: none; padding: 6px 10px; max-width: 220px; text-align: right; }
      #habitable-zone-toggle { display: none; padding: 6px 10px; max-width: 220px; text-align: right; }
      #moon-scale-toggle { display: none; padding: 6px 10px; max-width: 220px; text-align: right; }
      #moon-distance-toggle { display: none; padding: 6px 10px; max-width: 220px; text-align: right; }
      #moon-surface-toggle { display: none; padding: 6px 10px; max-width: 220px; text-align: right; }
      #exo-sky-toggle { display: none; padding: 6px 10px; max-width: 220px; text-align: right; }
      #sun-locator-toggle { display: none; padding: 6px 10px; max-width: 220px; text-align: right; }
      #day-night-toggle { display: none; padding: 6px 10px; max-width: 220px; text-align: right; }
      #info-panel {
        position: absolute; top: 0; right: 0; height: 100%; width: 320px;
        background: var(--color-card); border-left: 1px solid var(--color-border);
        padding: 16px; box-sizing: border-box; overflow-y: auto; display: none;
      }
      #info-panel.visible { display: block; }
      #info-panel h2 { margin-top: 0; font-family: var(--font-display); font-size: 18px; letter-spacing: 0.03em; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.03em; margin-bottom: 8px; }
      .badge.known { background: #1f4d2e; color: #9be8ac; }
      .badge.jwst_spectroscopy { background: #1f3a4d; color: #9bc8e8; }
      .badge.no_detection, .badge.no_data { background: #4d3a1f; color: #e8c89b; }
      .badge.dwarf { background: #3a2f4d; color: #cbb0e8; margin-left: 6px; }
      .molecule-tag { display: inline-block; background: var(--color-border); padding: 2px 6px; border-radius: 4px; margin: 2px; font-size: 12px; }
      .anecdote { background: var(--color-accent-bg); border-radius: 6px; padding: 8px 10px; }
      .sky-approx-note { background: #4d3a1f; color: #e8c89b; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.4; }
      .earth-compare { border: 1px solid var(--color-border); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
      .earth-compare p { margin: 0; }
      .earth-compare ul { margin: 6px 0 0; padding-left: 18px; }
      .earth-compare li { font-size: 13px; line-height: 1.5; }
      .photo-gallery { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .photo-gallery img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; border: 1px solid var(--color-border); }
      .voyager-photo { width: 100%; max-height: 220px; object-fit: contain; border-radius: 6px; margin-bottom: 8px; background: #05070d; }
      .learn-more { margin: 8px 0; }
      .learn-more summary { cursor: pointer; color: var(--color-accent, #8fd0ff); font-size: 13px; }
      .learn-more p { margin-top: 6px; font-size: 13px; line-height: 1.5; }
      .constellation-systems { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .link-button {
        display: block; width: 100%; text-align: left; background: var(--color-accent-bg);
        border: 1px solid var(--color-border); color: #ffffff; border-radius: 6px;
        padding: 8px 12px; font-size: 13px; min-height: 38px;
      }
      .link-button:hover { border-color: var(--color-accent); }
      /* Encart de sélection ("Nouvelle Navigation") : un clic sur un système/
         une étoile/une planète ne navigue plus directement — il affiche ce
         petit encart + le losange 3D autour de l'astre (selectionMarker.ts),
         et seul le bouton "Explorer" confirme l'entrée dans la vue. Un clic
         dans le vide referme l'encart sans jamais faire remonter d'un niveau
         tout seul (cf. main.ts, clearPendingSelection). */
      #selection-card {
        position: absolute; bottom: var(--space-4); left: 50%; transform: translateX(-50%);
        z-index: 20; display: none; flex-direction: column; align-items: center; gap: 4px;
        background: var(--color-card-solid); border: 1px solid var(--color-accent);
        border-radius: 10px; padding: 12px 22px; text-align: center; min-width: 180px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
      #selection-card.visible { display: flex; }
      #selection-card-label { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.03em; }
      #selection-card-type { font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
      #selection-card #selection-card-explore {
        font-family: var(--font-display); letter-spacing: 0.06em; margin-top: 6px;
        background: var(--color-accent-bg); border: 1px solid var(--color-accent); color: #ffffff;
        padding: 8px 18px; font-size: 13px; min-height: 38px;
      }
      #selection-card #selection-card-explore:hover { background: var(--color-accent); color: #ffffff; }
      #credits { position: absolute; bottom: var(--space-4); right: var(--space-4); font-size: 11px; opacity: 0.45; }
      #credits a { color: inherit; }
      /* Compteur public (total de vues + visiteurs en ligne) — cf. presence.ts.
         Juste au-dessus des crédits en desktop ; côté mobile, les crédits sont
         masqués donc on le place en bas-gauche pour ne pas chevaucher le
         distance-hud/selection-card (bas-droite/centre) au-dessus de la nav. */
      #visitor-counter {
        position: absolute; bottom: calc(var(--space-4) + 16px); right: var(--space-4); z-index: 10;
        font-size: 11px; opacity: 0.45; text-align: right;
      }
      html.is-mobile #visitor-counter {
        left: var(--space-4); right: auto; text-align: left;
        bottom: calc(56px + var(--space-4));
      }
      /* Repère de distance dynamique (vue galaxie uniquement, cf. main.ts::
         updateDistanceHud) : distance caméra↔Soleil (UA/années-lumière,
         bascule auto) + temps de trajet équivalent à la vitesse de Voyager 1 —
         adapté de l'idée du site concurrent Solar System Scope. */
      #distance-hud {
        display: none; position: absolute; bottom: 40px; right: var(--space-4); z-index: 10;
        font-family: var(--font-display); text-align: right; letter-spacing: 0.03em;
        background: var(--color-card); border: 1px solid var(--color-border); border-radius: 6px;
        padding: 8px 12px; font-size: 12px; line-height: 1.6;
      }
      #distance-hud.visible { display: block; }
      #distance-hud .distance-hud-value { color: var(--color-fg); font-size: 14px; }
      #distance-hud .distance-hud-travel { color: var(--color-muted); font-size: 11px; }
      .photo-thumb { display: block; padding: 0; border: none; background: none; cursor: pointer; min-height: 0; }
      #lightbox {
        display: none; position: fixed; inset: 0; z-index: 1000;
        background: rgba(5, 7, 13, 0.92); align-items: center; justify-content: center; flex-direction: column;
      }
      #lightbox.visible { display: flex; }
      #lightbox-img { max-width: 88vw; max-height: 78vh; object-fit: contain; border-radius: 6px; }
      #lightbox-caption { color: var(--color-fg); font-size: 13px; margin-top: 12px; max-width: 70vw; text-align: center; }
      #lightbox-caption a { color: #8fd0ff; }
      #lightbox-close, .lightbox-nav {
        position: absolute; background: none; border: none; color: var(--color-fg);
        cursor: pointer; min-height: 0; opacity: 0.7;
      }
      #lightbox-close:hover, .lightbox-nav:hover { opacity: 1; }
      #lightbox-close { top: 16px; right: 20px; font-size: 26px; }
      .lightbox-nav { top: 50%; transform: translateY(-50%); font-size: 44px; padding: 0 16px; }
      #lightbox-prev { left: 8px; }
      #lightbox-next { right: 8px; }
      #lightbox-close:focus-visible, .lightbox-nav:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
      /* Page d'accueil : nouveau point d'entrée de l'app (remplace le boot
         direct sur la vue galaxie) — un choix entre les deux vues du ciel,
         par-dessus un fond étoilé 3D discret (cf. main.ts, réutilise
         galaxy.ts::makeStarfield). */
      /* pointer-events: none sur le conteneur plein écran (sinon il capte les
         clics destinés à #bottom-left/#credits qui se trouvent visuellement
         dessous, cf. #ui-overlay > * { pointer-events: auto } plus haut) —
         seuls les éléments interactifs (.home-choice) le réactivent. */
      #home-screen {
        display: none; position: absolute; inset: 0; z-index: 30; pointer-events: none;
        align-items: center; justify-content: center; flex-direction: column; gap: 28px;
        text-align: center; padding: 24px; box-sizing: border-box;
      }
      #home-screen.visible { display: flex; }
      #home-title { font-family: var(--font-display); font-size: clamp(28px, 5vw, 48px); letter-spacing: 0.1em; margin: 0; text-transform: uppercase; }
      #home-subtitle { color: var(--color-muted); font-size: 14px; margin: 0; max-width: 480px; }
      #home-choices { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
      .home-choice {
        font-family: var(--font-display); background: var(--color-card-solid); border: 1px solid var(--color-border);
        color: var(--color-fg); border-radius: 12px; padding: 28px 32px; width: 240px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 0;
        transition: border-color 150ms ease-out, transform 150ms ease-out; pointer-events: auto;
      }
      .home-choice:hover { border-color: var(--color-accent); color: var(--color-fg); transform: translateY(-4px); }
      .home-choice:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }
      .home-choice-icon { font-size: 40px; line-height: 1; }
      .home-choice-label { font-size: 15px; letter-spacing: 0.04em; }
      .home-choice-desc { font-family: system-ui, sans-serif; font-size: 12px; color: var(--color-muted); letter-spacing: normal; line-height: 1.4; }
      @media (prefers-reduced-motion: reduce) {
        #ui-overlay button { transition: none; }
        .home-choice { transition: none; }
        #mobile-info-sheet, #mobile-settings-sheet { transition: none; }
      }

      /* ====================================================================
         UI mobile — bascule automatique via <html class="is-mobile"> (cf.
         src/responsive.ts, basé sur la largeur de viewport). Sans cette
         classe (desktop), aucune de ces règles ne s'applique : le layout
         desktop existant reste strictement identique.
         ==================================================================== */
      html.is-mobile #ui-overlay button { min-height: 44px; min-width: 44px; font-size: 14px; }
      html.is-mobile #top-left-bar #home-btn { display: none; }
      html.is-mobile #breadcrumb { max-width: calc(100vw - 24px); overflow-x: auto; white-space: nowrap; }
      html.is-mobile #credits { display: none; }
      html.is-mobile #bottom-left { display: none; }
      html.is-mobile #distance-hud { bottom: calc(56px + env(safe-area-inset-bottom, 0px) + var(--space-4)); }
      html.is-mobile #selection-card { bottom: calc(56px + env(safe-area-inset-bottom, 0px) + var(--space-4) + var(--space-3)); }
      html.is-mobile .lightbox-nav, html.is-mobile #lightbox-close { min-height: 44px; min-width: 44px; }

      /* Panneaux/toggles déplacés en JS (applyChromeMode/moveTo, main.ts) dans
         les tiroirs mobiles ci-dessous : neutralise leur positionnement
         absolu d'origine une fois réinsérés dans un conteneur en flux normal.
         Les fonctions renderXToggle()/renderXInfoPanel() existantes ne
         changent pas — elles continuent d'écrire dans les mêmes éléments,
         où qu'ils vivent dans le DOM. */
      html.is-mobile #search-box { position: static; transform: none; width: 100%; }
      html.is-mobile #search-input { width: 100%; box-sizing: border-box; }
      /* Dans le tiroir plein écran (mobile-search-slot est déjà scrollable,
         cf. .mobile-sheet-body), la liste doit s'écouler sous le champ au
         lieu de flotter en overlay par-dessus l'en-tête du tiroir. */
      html.is-mobile #search-results {
        position: static; max-height: none; border: none; border-radius: 0;
        box-shadow: none; background: none; margin-top: var(--space-3);
      }
      html.is-mobile #info-panel { position: static; width: 100%; height: auto; border-left: none; padding: 0; }
      html.is-mobile #right-toggles { display: none; }
      html.is-mobile #compare-toggle-group,
      html.is-mobile #pause-toggle {
        position: static; display: flex; width: 100%;
      }
      html.is-mobile #mobile-settings-slot { display: flex; flex-direction: column; gap: var(--space-3); }
      html.is-mobile #mobile-settings-slot > * { width: 100%; }
      html.is-mobile #mobile-settings-slot button {
        max-width: none; width: 100%; text-align: left; box-sizing: border-box;
      }

      /* Barre de navigation mobile (bas d'écran, 4 entrées : Accueil / Recherche / Infos / Réglages) */
      #mobile-bottom-nav { display: none; }
      html.is-mobile #mobile-bottom-nav {
        display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        height: 56px; background: var(--color-card-solid); border-top: 1px solid var(--color-border);
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      #mobile-bottom-nav .mnav-btn {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px; background: none; border: none; border-radius: 0; color: var(--color-muted);
        min-height: 56px;
      }
      #mobile-bottom-nav .mnav-btn.active { color: var(--color-fg); background: var(--color-accent-bg); }
      #mobile-bottom-nav .mnav-icon { font-size: 20px; line-height: 1; }
      #mobile-bottom-nav .mnav-label { font-size: 10px; letter-spacing: 0.02em; }

      /* Tiroir plein écran (Recherche) et tiroirs remontant du bas (Infos, Réglages) */
      #mobile-search-overlay { display: none; }
      html.is-mobile #mobile-search-overlay.open {
        display: flex; flex-direction: column; position: fixed; top: 0; left: 0; right: 0;
        bottom: 56px; z-index: 50; background: var(--color-bg);
      }
      #mobile-info-sheet, #mobile-display-sheet, #mobile-settings-sheet { display: none; }
      html.is-mobile #mobile-info-sheet, html.is-mobile #mobile-display-sheet, html.is-mobile #mobile-settings-sheet {
        display: flex; flex-direction: column; position: fixed; left: 0; right: 0; bottom: 56px; z-index: 45;
        max-height: 70vh; background: var(--color-card-solid);
        border: 1px solid var(--color-border); border-bottom: none;
        border-top-left-radius: 16px; border-top-right-radius: 16px;
        transform: translateY(calc(100% + 56px)); transition: transform 200ms ease-out;
        box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4);
      }
      html.is-mobile #mobile-info-sheet.open, html.is-mobile #mobile-display-sheet.open, html.is-mobile #mobile-settings-sheet.open {
        transform: translateY(0);
      }
      .mobile-sheet-header {
        display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        padding: 14px 16px; border-bottom: 1px solid var(--color-border);
        font-family: var(--font-display); letter-spacing: 0.03em; font-size: 15px;
      }
      .mobile-sheet-body { padding: 12px 16px; overflow-y: auto; }
      .mobile-sheet-close {
        font-family: var(--font-display); background: none; border: none; color: var(--color-fg);
        font-size: 22px; line-height: 1; padding: 4px 8px; cursor: pointer; min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>
      <div id="ui-overlay">
        <div id="top-left-bar">
          <button id="home-btn" type="button"></button>
          <div id="breadcrumb"></div>
        </div>
        <div id="home-screen">
          <h1 id="home-title"></h1>
          <p id="home-subtitle"></p>
          <div id="home-choices">
            <button id="home-choice-galaxy" class="home-choice" type="button">
              <span class="home-choice-icon">🌌</span>
              <span class="home-choice-label" id="home-choice-galaxy-label"></span>
              <span class="home-choice-desc" id="home-choice-galaxy-desc"></span>
            </button>
            <button id="home-choice-sky2d" class="home-choice" type="button">
              <span class="home-choice-icon">✨</span>
              <span class="home-choice-label" id="home-choice-sky2d-label"></span>
              <span class="home-choice-desc" id="home-choice-sky2d-desc"></span>
            </button>
          </div>
        </div>
        <div id="search-box">
          <input id="search-input" type="text" autocomplete="off">
          <div id="search-results"></div>
        </div>
        <div id="right-toggles">
          <div id="lang-toggle"></div>
          <div id="unit-toggle"></div>
          <button id="sci-interp-toggle"></button>
          <button id="orbit-plane-toggle"></button>
          <button id="habitable-zone-toggle"></button>
          <button id="moon-scale-toggle"></button>
          <button id="moon-distance-toggle"></button>
          <button id="moon-surface-toggle"></button>
          <button id="exo-sky-toggle"></button>
          <button id="sun-locator-toggle"></button>
          <button id="day-night-toggle"></button>
          <button id="install-app-toggle"></button>
        </div>
        <div id="compare-toggle-group">
          <button id="compare-earth-toggle"></button>
          <button id="compare-sun-toggle"></button>
        </div>
        <button id="pause-toggle"></button>
        <div id="info-panel"></div>
        <div id="selection-card">
          <div id="selection-card-label"></div>
          <div id="selection-card-type"></div>
          <button id="selection-card-explore" type="button"></button>
        </div>
        <div id="bottom-left">
          <div id="hint"></div>
          <button id="music-toggle"></button>
        </div>
        <div id="distance-hud">
          <div id="distance-hud-value" class="distance-hud-value"></div>
          <div id="distance-hud-travel" class="distance-hud-travel"></div>
        </div>
        <div id="visitor-counter"><span id="visitor-counter-text"></span> <span id="app-version-mobile"></span></div>
        <div id="credits"><span id="credits-textures-label"></span> : <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> (CC BY 4.0) — <span id="credits-constellations-label"></span> : <a href="https://github.com/dcf21/constellation-stick-figures" target="_blank" rel="noopener">dcf21/constellation-stick-figures</a> (GPLv3, D. Ford) — <span id="credits-music-label"></span> : <span id="credits-music-title">Orbites Dérivantes</span> (<span id="credits-music-author">cycyno</span>) — <span id="app-version"></span></div>
        <nav id="mobile-bottom-nav">
          <button id="mnav-home" type="button" class="mnav-btn">
            <span class="mnav-icon" aria-hidden="true">🏠</span>
            <span class="mnav-label" id="mnav-home-label"></span>
          </button>
          <button id="mnav-search" type="button" class="mnav-btn">
            <span class="mnav-icon" aria-hidden="true">🔍</span>
            <span class="mnav-label" id="mnav-search-label"></span>
          </button>
          <button id="mnav-info" type="button" class="mnav-btn">
            <span class="mnav-icon" aria-hidden="true">ℹ️</span>
            <span class="mnav-label" id="mnav-info-label"></span>
          </button>
          <button id="mnav-display" type="button" class="mnav-btn">
            <span class="mnav-icon" aria-hidden="true">🎛️</span>
            <span class="mnav-label" id="mnav-display-label"></span>
          </button>
          <button id="mnav-settings" type="button" class="mnav-btn">
            <span class="mnav-icon" aria-hidden="true">⚙️</span>
            <span class="mnav-label" id="mnav-settings-label"></span>
          </button>
        </nav>
        <div id="mobile-search-overlay">
          <div class="mobile-sheet-header">
            <span id="mobile-search-title"></span>
            <button type="button" class="mobile-sheet-close" id="mobile-search-close">✕</button>
          </div>
          <div class="mobile-sheet-body" id="mobile-search-slot"></div>
        </div>
        <div id="mobile-info-sheet">
          <div class="mobile-sheet-header">
            <span id="mobile-info-title"></span>
            <button type="button" class="mobile-sheet-close" id="mobile-info-close">✕</button>
          </div>
          <div class="mobile-sheet-body" id="mobile-info-slot"></div>
        </div>
        <div id="mobile-display-sheet">
          <div class="mobile-sheet-header">
            <span id="mobile-display-title"></span>
            <button type="button" class="mobile-sheet-close" id="mobile-display-close">✕</button>
          </div>
          <div class="mobile-sheet-body" id="mobile-display-slot"></div>
        </div>
        <div id="mobile-settings-sheet">
          <div class="mobile-sheet-header">
            <span id="mobile-settings-title"></span>
            <button type="button" class="mobile-sheet-close" id="mobile-settings-close">✕</button>
          </div>
          <div class="mobile-sheet-body" id="mobile-settings-slot"></div>
        </div>
      </div>
      <audio id="bg-music" preload="auto"></audio>
      <div id="lightbox">
        <button id="lightbox-close">✕</button>
        <button id="lightbox-prev" class="lightbox-nav">‹</button>
        <img id="lightbox-img" alt="">
        <button id="lightbox-next" class="lightbox-nav">›</button>
        <div id="lightbox-caption"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
