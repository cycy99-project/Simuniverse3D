server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA fallback (routeur de scène interne, pas de vraies routes serveur)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html et service worker : jamais de cache navigateur/CDN, sinon un
    # client garde une version périmée (référençant d'anciens bundles hashés
    # ou un ancien comportement de service worker) après déploiement — même
    # bug déjà rencontré sur Cycymulator, cf. api/main.py serve_sw().
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache aggressif sur assets versionnes par Vite (hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Données JSON et textures : re-vérification a chaque déploiement, mais
    # pas de cache-busting par hash (noms fixes fetch'es par loader.ts)
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
